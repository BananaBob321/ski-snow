name: Snow data

# Once a day, just after Open-Meteo's free daily allowance resets (00:00 UTC), download as many
# resorts as the allowance allows, then commit the results. Turns itself off when all are done.
on:
  schedule:
    - cron: "23 0 * * *"   # 00:23 UTC = 11:23am Melbourne in daylight saving
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: snow
        run: node run.cjs
        env:
          MINUTES: "100"
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json snow_raw.csv status.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Snow data: $(head -1 status.txt)"
          git push
      - name: Turn off when finished
        if: steps.snow.outputs.done == 'true'
        run: gh workflow disable snow.yml
        env:
          GH_TOKEN: ${{ github.token }}
